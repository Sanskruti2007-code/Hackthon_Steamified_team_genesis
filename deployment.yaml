apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual_cro-vanilla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual_cro-vanilla
  template:
    metadata:
      labels:
        app: virtual_cro-vanilla
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
